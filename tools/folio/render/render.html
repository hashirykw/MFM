<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" data-capture="1"></canvas>
<script type="module">
import * as THREE from '/assets/folio/js/three.module.min.js';
import { makeStage } from '/tools/folio/src/stage3d.js';
const q = new URLSearchParams(location.search), w = +q.get('w'), h = +q.get('h');
const st = makeStage(THREE, document.getElementById('c'), q.get('m'), { dark: q.get('theme') === 'dark' });
st.root.rotation.y = +(q.get('ry') || 0);
st.frame(w, h, +(q.get('fill') || .94));
requestAnimationFrame(() => { st.render(); st.render(); window.png = document.getElementById('c').toDataURL('image/png'); window.done = true; });
</script></body></html>
